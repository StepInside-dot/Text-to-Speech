<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxCap Studio — TTS &amp; Caption Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Scanline overlay -->
  <div class="scanlines" aria-hidden="true"></div>

  <div class="app">

    <!-- ── Top bar ── -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
            <rect x="1" y="5" width="3" height="12" rx="1" fill="currentColor" opacity="0.4"/>
            <rect x="6" y="2" width="3" height="18" rx="1" fill="currentColor" opacity="0.6"/>
            <rect x="11" y="0" width="3" height="22" rx="1" fill="currentColor"/>
            <rect x="16" y="3" width="3" height="16" rx="1" fill="currentColor" opacity="0.6"/>
          </svg>
          VoxCap Studio
        </span>
        <span class="topbar-version">v2.0</span>
      </div>
      <div class="topbar-right">
        <div class="status-indicator" id="global-status">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">IDLE</span>
        </div>
      </div>
    </header>

    <!-- ── Main grid ── -->
    <main class="main-grid">

      <!-- ══ LEFT COLUMN ══ -->
      <div class="col-left">

        <!-- Panel: Text input -->
        <section class="panel" id="panel-input">
          <div class="panel-header">
            <span class="panel-label">01 / INPUT</span>
            <span class="char-counter"><span id="char-count">0</span> / 5000</span>
          </div>
          <textarea
            id="text-input"
            class="text-input"
            placeholder="Type or paste your text here…"
            maxlength="5000"
            spellcheck="true"
          >The quick brown fox jumps over the lazy dog. Real-time captions appear word by word as the voice speaks. When finished, download your audio recording and caption file.</textarea>
        </section>

        <!-- Panel: Voice & settings -->
        <section class="panel" id="panel-voice">
          <div class="panel-header">
            <span class="panel-label">02 / VOICE &amp; SETTINGS</span>
          </div>

          <div class="settings-grid">

            <div class="setting-group full-width">
              <label class="setting-label" for="voice-select">Voice</label>
              <div class="select-wrap">
                <select id="voice-select" class="setting-select">
                  <option value="">Loading voices…</option>
                </select>
                <span class="select-arrow">▾</span>
              </div>
            </div>

            <div class="setting-group">
              <label class="setting-label" for="rate-slider">
                Speed
                <span class="setting-value" id="rate-display">1.0×</span>
              </label>
              <input type="range" id="rate-slider" class="slider" min="0.5" max="2" step="0.1" value="1" />
            </div>

            <div class="setting-group">
              <label class="setting-label" for="pitch-slider">
                Pitch
                <span class="setting-value" id="pitch-display">1.0</span>
              </label>
              <input type="range" id="pitch-slider" class="slider" min="0.5" max="2" step="0.1" value="1" />
            </div>

            <div class="setting-group">
              <label class="setting-label" for="volume-slider">
                Volume
                <span class="setting-value" id="volume-display">100%</span>
              </label>
              <input type="range" id="volume-slider" class="slider" min="0" max="1" step="0.05" value="1" />
            </div>

            <div class="setting-group">
              <label class="setting-label" for="caption-format">Caption Format</label>
              <div class="select-wrap">
                <select id="caption-format" class="setting-select">
                  <option value="vtt">WebVTT (.vtt)</option>
                  <option value="srt">SubRip (.srt)</option>
                </select>
                <span class="select-arrow">▾</span>
              </div>
            </div>

          </div>

          <!-- Transport controls -->
          <div class="transport">
            <button id="speak-btn" class="btn btn-primary" aria-label="Play">
              <span class="btn-icon" id="speak-icon">
                <svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><path d="M0 0L14 8L0 16V0Z"/></svg>
              </span>
              <span id="speak-label">Play</span>
            </button>
            <button id="stop-btn" class="btn btn-secondary" disabled aria-label="Stop">
              <span class="btn-icon">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect width="12" height="12" rx="2"/></svg>
              </span>
              Stop
            </button>
          </div>

        </section>

      </div>

      <!-- ══ RIGHT COLUMN ══ -->
      <div class="col-right">

        <!-- Panel: Live caption stage -->
        <section class="panel panel-caption" id="panel-caption">
          <div class="panel-header">
            <span class="panel-label">03 / LIVE CAPTIONS</span>
            <div class="rec-badge" id="rec-badge">
              <span class="rec-dot"></span>REC
            </div>
          </div>

          <div class="caption-stage" id="caption-stage">
            <div class="caption-idle-msg" id="caption-idle-msg">
              <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                <circle cx="18" cy="18" r="17" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
                <path d="M13 12L25 18L13 24V12Z" fill="currentColor" opacity="0.3"/>
              </svg>
              <p>Press Play to begin</p>
            </div>
            <div class="caption-display" id="caption-display"></div>
          </div>

          <!-- Progress bar -->
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>

          <!-- Timing readout -->
          <div class="timing-row">
            <span class="timing-label">ELAPSED</span>
            <span class="timing-value" id="elapsed-time">00:00.0</span>
            <span class="timing-label">WORDS</span>
            <span class="timing-value" id="word-count-display">0</span>
          </div>

        </section>

        <!-- Panel: Caption log -->
        <section class="panel" id="panel-log">
          <div class="panel-header">
            <span class="panel-label">04 / CAPTION LOG</span>
            <button class="btn-clear" id="clear-log-btn" title="Clear log">✕</button>
          </div>
          <div class="caption-log" id="caption-log">
            <p class="log-empty">Caption entries will appear here during playback.</p>
          </div>
        </section>

        <!-- Panel: Downloads -->
        <section class="panel" id="panel-downloads">
          <div class="panel-header">
            <span class="panel-label">05 / DOWNLOADS</span>
          </div>

          <div class="download-grid">

            <div class="download-card" id="card-audio">
              <div class="download-card-icon">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                  <rect x="1" y="7" width="3" height="14" rx="1.5" fill="currentColor" opacity="0.4"/>
                  <rect x="6" y="4" width="3" height="20" rx="1.5" fill="currentColor" opacity="0.6"/>
                  <rect x="11" y="1" width="3" height="26" rx="1.5" fill="currentColor"/>
                  <rect x="16" y="5" width="3" height="18" rx="1.5" fill="currentColor" opacity="0.7"/>
                  <rect x="21" y="9" width="3" height="10" rx="1.5" fill="currentColor" opacity="0.4"/>
                </svg>
              </div>
              <div class="download-card-info">
                <span class="download-card-title">Audio File</span>
                <span class="download-card-meta" id="audio-meta">Not recorded yet</span>
              </div>
              <button class="btn btn-download" id="download-audio-btn" disabled>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M6.5 0V9M6.5 9L3 5.5M6.5 9L10 5.5M1 11H12"/></svg>
                Download
              </button>
            </div>

            <div class="download-card" id="card-caption">
              <div class="download-card-icon">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                  <rect x="2" y="4" width="24" height="20" rx="3" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
                  <rect x="6" y="10" width="16" height="2" rx="1" fill="currentColor" opacity="0.6"/>
                  <rect x="6" y="15" width="11" height="2" rx="1" fill="currentColor" opacity="0.4"/>
                  <rect x="6" y="20" width="7" height="2" rx="1" fill="currentColor" opacity="0.3"/>
                </svg>
              </div>
              <div class="download-card-info">
                <span class="download-card-title">Caption File</span>
                <span class="download-card-meta" id="caption-meta">Not generated yet</span>
              </div>
              <button class="btn btn-download" id="download-caption-btn" disabled>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><path d="M6.5 0V9M6.5 9L3 5.5M6.5 9L10 5.5M1 11H12"/></svg>
                Download
              </button>
            </div>

          </div>

          <!-- MediaRecorder notice -->
          <p class="recorder-notice" id="recorder-notice"></p>

        </section>

      </div>
    </main>

  </div><!-- /.app -->

  <script src="script.js"></script>
</body>
</html>
